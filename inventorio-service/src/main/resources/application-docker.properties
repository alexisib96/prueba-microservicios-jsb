# DataSource
spring.datasource.url=jdbc:sqlserver://${SQLSERVER_HOST:sqlserver}:${SQLSERVER_PORT:1433};databaseName=${INVENTORY_DB_NAME:InventorioDB};encrypt=true;trustServerCertificate=true
spring.datasource.username=${SQLSERVER_USER:sa}
spring.datasource.password=${SQLSERVER_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Logging
logging.level.root=INFO
logging.level.com.catalogo.inventory=INFO
logging.level.org.hibernate.SQL=WARN

spring.jpa.show-sql=false
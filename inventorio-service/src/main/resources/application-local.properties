spring.datasource.url=jdbc:sqlserver://${SQLSERVER_HOST:localhost}:${SQLSERVER_PORT:1433};databaseName=${INVENTORY_DB_NAME:InventorioDB};encrypt=true;trustServerCertificate=true
spring.datasource.username=${SQLSERVER_USER:app_user}
spring.datasource.password=${SQLSERVER_PASSWORD:AppPassword123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

logging.level.root=INFO
logging.level.com.catalogo.inventarioservice=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
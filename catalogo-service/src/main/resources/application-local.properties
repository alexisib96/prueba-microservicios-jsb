
spring.datasource.url=jdbc:sqlserver://${SQLSERVER_HOST:localhost}:${SQLSERVER_PORT:1433};databaseName=${CATALOG_DB_NAME:CatalogoDB};encrypt=true;trustServerCertificate=true
spring.datasource.username=${SQLSERVER_USER:app_user}
spring.datasource.password=${SQLSERVER_PASSWORD:AppPassword123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

inventory.service.url=${INVENTORY_SERVICE_URL:http://localhost:8082}
inventory.service.timeout-ms=3000

logging.level.root=INFO
logging.level.com.catalogo.catalog=DEBUG
logging.level.org.hibernate.SQL=DEBUG
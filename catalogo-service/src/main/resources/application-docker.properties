# DataSource
spring.datasource.url=jdbc:sqlserver://${SQLSERVER_HOST:sqlserver}:${SQLSERVER_PORT:1433};databaseName=${CATALOG_DB_NAME:CatalogoDB};encrypt=true;trustServerCertificate=true
spring.datasource.username=${SQLSERVER_USER:sa}
spring.datasource.password=${SQLSERVER_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# URL del inventory-service (nombre del servicio Docker)
inventory.service.url=${INVENTORY_SERVICE_URL:http://inventorio-service:8082}
inventory.service.timeout-ms=3000

# Logging
logging.level.root=INFO
logging.level.com.catalogo.catalog=INFO
logging.level.org.hibernate.SQL=WARN

spring.jpa.show-sql=false
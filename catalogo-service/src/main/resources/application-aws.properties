# =============================================
# DataSource - RDS SQL Server
# =============================================
spring.datasource.url=jdbc:sqlserver://${DB_HOST}:${DB_PORT:1433};databaseName=${DB_NAME:CatalogoDB};encrypt=true;trustServerCertificate=false
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# =============================================
# Connection pool
# =============================================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# =============================================
# URL del inventory-service en AWS
# =============================================
inventory.service.url=${INVENTORY_SERVICE_URL}
inventory.service.timeout-ms=3000

# =============================================
# Logging
# =============================================
logging.level.root=INFO
logging.level.com.catalogo.catalog=INFO
logging.level.org.hibernate.SQL=WARN
spring.jpa.show-sql=false